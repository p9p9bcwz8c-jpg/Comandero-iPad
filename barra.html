<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Barra · Ventas La Yola</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111}header{position:sticky;top:0;background:#fff;padding:14px;border-bottom:1px solid #ddd;z-index:5}h1{margin:0 0 5px;font-size:22px}#status{font-size:13px;color:#666}main{max-width:760px;margin:auto;padding:12px 12px 100px}.order{background:#fff;border-radius:16px;margin:10px 0;padding:15px;box-shadow:0 1px 4px #0001}.top{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding-bottom:10px}.num{font-weight:800}.table{font-size:20px;font-weight:800}.time{font-size:13px;color:#666}.item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.qty{font-weight:800;margin-right:8px}.done{margin-top:10px;border:0;border-radius:10px;padding:11px 13px;background:#111;color:#fff;font:inherit}.empty{background:#fff;border-radius:16px;padding:30px;text-align:center;color:#666}</style><script src="firebase-config.js"></script></head><body><header><h1>🍹 Barra</h1><div id="status">Conectando…</div><a href="index.html" style="display:inline-block;margin-top:8px;border-radius:10px;padding:9px 12px;background:#111;color:#fff;text-decoration:none">🍽️ Volver al comandero</a><button id="pushBtn" style="margin-top:8px;border:0;border-radius:10px;padding:9px 12px">🔔 Activar notificaciones</button></header><main id="orders"><div class="empty">Cargando…</div></main><script type="module">
let db,ref,onValue,set,last=new Set();const VAPID_KEY=window.VENTAS_VAPID_KEY||'PON_AQUI_TU_CLAVE_PUBLICA_VAPID';const allowed=['Bebidas','Cerveza','Café','Varios'];function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(v){const list=Object.values(v||{}).filter(o=>o&&(o.status_barra||'pendiente')==='pendiente').map(o=>({...o,items:(o.items||[]).filter(x=>allowed.includes(x.category))})).filter(o=>o.items.length).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));document.getElementById('orders').innerHTML=list.length?list.map(o=>`<article class="order"><div class="top"><div><div class="num">Comanda #${esc(o.id.slice(-6).toUpperCase())}</div><div class="time">${new Date(o.createdAt).toLocaleTimeString('es-ES')}</div></div><div class="table">Mesa ${esc(o.table)}</div></div>${o.items.map(i=>{const q=Number(i.qty)||0,p=Number(i.price)||0;return `<div class="item"><span><span class="qty">${q}×</span>${esc(i.name)}</span><span>${(p*q).toFixed(2)} €</span></div>`}).join('')}${o.noteBarra?`<div class="note" style="margin-top:10px;padding:10px;border-radius:10px;background:#fff3cd;border:1px solid #f0d98a"><b>📝 Nota para Barra:</b> ${esc(o.noteBarra)}</div>`:''}<button class="done" onclick="done('${esc(o.id)}')">✓ Marcar preparada</button></article>`).join(''):'<div class="empty">No hay comandas pendientes.</div>'}async function enablePush(){try{if(VAPID_KEY.startsWith('PON_AQUI')){alert('Falta configurar la clave VAPID de Firebase.');return;}const {getMessaging,getToken,onMessage}=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-messaging.js');const {getApp}=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');const app=getApp();const messaging=getMessaging(app);const reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');const token=await getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});if(!token){alert('No se obtuvo el permiso de notificaciones.');return;}await set(ref(db,'ventas_la_yola/pushTokens/barra/'+encodeURIComponent(token)),{token,createdAt:Date.now()});alert('Notificaciones activadas en este iPhone.');onMessage(messaging,p=>{if(p?.notification)new Notification(p.notification.title||'Nueva comanda',{body:p.notification.body||'Nueva comanda de barra'})})}catch(e){console.error(e);alert('No se pudieron activar las notificaciones.')}}
window.done=async id=>{try{await set(ref(db,'ventas_la_yola/comandas/'+id+'/status_barra'),'preparada')}catch(e){alert('No se pudo actualizar.')}};async function start(){try{const f=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'),a=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js'),r=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js');const app=f.initializeApp(window.VENTAS_FIREBASE_CONFIG);await a.signInAnonymously(a.getAuth(app));db=r.getDatabase(app);({ref,onValue,set}=r);onValue(ref(db,'ventas_la_yola/comandas'),s=>{const v=s.val()||{};const ids=Object.keys(v).filter(id=>v[id]?.status_barra==='pendiente' && (v[id]?.items||[]).some(x=>allowed.includes(x.category)));last=new Set(ids);render(v);document.getElementById('status').textContent='Conectado · tiempo real';document.getElementById('status').style.color='#188038'})}catch(e){console.error(e);document.getElementById('status').textContent='Error de conexión'}}start();document.getElementById('pushBtn').onclick=enablePush;</script></body></html>
