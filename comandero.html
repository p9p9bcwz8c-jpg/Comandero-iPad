<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comandero · Ventas La Yola</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#111}
header{position:sticky;top:0;z-index:5;background:#fff;padding:14px 12px 10px;border-bottom:1px solid #ddd}
.headerInner{max-width:1400px;margin:auto}
h1{font-size:22px;margin:0 0 8px}
.tabs{display:flex;gap:7px;overflow:auto}
.tab,.action,.plusminus{border:0;border-radius:10px;background:#eee;padding:10px 13px;font:inherit;cursor:pointer}
.tab.active{background:#111;color:#fff}
main{padding:16px 20px 130px;max-width:1400px;margin:auto}
.tableTitle{font-size:20px;font-weight:800;margin:3px 0 10px}
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.category{font-weight:800;font-size:18px;margin:18px 0 8px}
.categoryGrid{display:block}
.catGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.catButton{background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px 10px;font-size:16px;font-weight:700;cursor:pointer}
.catBack{background:#eee;border:0;border-radius:10px;padding:10px 14px;font:inherit;margin-bottom:10px;cursor:pointer}
.product{background:#fff;border-radius:14px;margin:7px 0;padding:12px;display:flex;justify-content:space-between;align-items:center}
.price{font-size:13px;color:#666;margin-top:3px}
.controls{display:flex;align-items:center;gap:9px}
.plusminus{width:44px;height:44px;font-size:22px}
.qty{min-width:28px;text-align:center;font-weight:800}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.action{flex:1;min-width:145px;cursor:pointer}
.danger{background:#fee;color:#a00}
.close{background:#111;color:#fff}
.split{background:#fff3cd}
.total{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:6}
.totalInner{max-width:1400px;margin:auto;width:100%;display:flex;justify-content:space-between;align-items:center}
.total strong{font-size:22px}
.sync{font-size:12px;color:#666;margin:5px 0}
.summary{background:#fff;border-radius:14px;padding:15px;max-width:520px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.nav{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
.nav a{flex:0 1 180px;text-align:center;padding:10px;border-radius:10px;text-decoration:none;color:#111}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;padding:20px;border-radius:20px 20px 0 0;max-height:85vh;overflow:auto}
.sheet button{width:100%;margin:6px 0;padding:14px;cursor:pointer}
.hidden{display:none}
.noteBox{background:#fff;border-radius:14px;padding:12px;margin:12px 0;border:1px solid #ddd}
.noteBox label{display:block;margin-bottom:7px}
.noteBox textarea{width:100%;min-height:78px;border:1px solid #ccc;border-radius:10px;padding:10px;font:inherit;resize:vertical}
.takeoutFields{display:block}
.field{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:4px 0 12px}
.orderCard{background:#fff;border-radius:15px;padding:14px;margin:9px 0}
.ordersGrid{display:block}
.muted{color:#666;font-size:13px}
.empty{background:#fff;border-radius:14px;padding:25px;text-align:center;color:#666}
.mixedRow{display:flex;gap:10px;margin:10px 0}
.mixedRow div{flex:1}
.mixedRow input{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;font-size:16px}
.offlineBanner{display:none;background:#c0392b;color:#fff;text-align:center;padding:8px 12px;font-weight:700;font-size:14px}

@media (min-width:780px){
  header{padding:16px 20px 12px}
  main{padding:20px 24px 40px}
  .total{position:sticky;bottom:0;border-top:1px solid #ddd}
  .categoryGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .categoryGrid .product{margin:0}
  .catGrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .ordersGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .ordersGrid .orderCard{margin:0}
  .actions{max-width:none}
  .modal{align-items:center}
  .sheet{width:auto;min-width:380px;max-width:460px;border-radius:20px;max-height:80vh}
  .nav{max-width:none}
  
  .noteRow{display:grid;grid-template-columns:2fr 1fr;gap:16px}
  .takeoutFields{display:flex;gap:16px;max-width:900px}
  .takeoutFields>div{flex:1}
}
</style>
<script src="firebase-config.js"></script>
</head>
<body>
<div id="offlineBanner" class="offlineBanner">⚠️ Sin conexión — no cierres esta pestaña, los cambios se guardarán al reconectar</div>
<header>
  <div class="headerInner">
    <h1>Ventas La Yola</h1>
    <div id="tabs" class="tabs"></div>
    <div id="sync" class="sync">Conectando…</div>
  </div>
</header>
<main id="app"></main>
<div id="total" class="total"></div>

<div id="payModal" class="modal hidden">
  <div class="sheet">
    <h2 id="payTitle">Cobrar</h2>
    <button onclick="closeWith('efectivo')">💵 Efectivo</button>
    <button onclick="closeWith('tarjeta')">💳 Tarjeta</button>
    <button onclick="openMixedModal()">💵💳 Pago mixto</button>
    <button onclick="printCurrentAccount()">🧾 Ver / imprimir cuenta</button>
    <button onclick="hidePay()">Cancelar</button>
  </div>
</div>

<div id="mixedModal" class="modal hidden">
  <div class="sheet">
    <h2>💵💳 Pago mixto</h2>
    <div class="muted" id="mixedTotal">Total: 0,00 €</div>
    <div class="mixedRow">
      <div><label><b>💵 Efectivo</b></label><input id="mixedCash" type="number" step="0.01" min="0" placeholder="0,00"></div>
      <div><label><b>💳 Tarjeta</b></label><input id="mixedCard" type="number" step="0.01" min="0" placeholder="0,00"></div>
    </div>
    <div class="muted">La suma de ambos montos debe ser igual al total.</div>
    <button onclick="confirmMixed()">Confirmar pago mixto</button>
    <button onclick="hideMixedModal()">Cancelar</button>
  </div>
</div>

<script>
const tables=[1,2,3,4,5,7,8,9,11,12];
const DEFAULT_PRODUCTS=[
  {cat:'Bebidas',items:[['Refresco',1.8],['Agua P',1],['Agua G',1.5],['Agua Gas',1.2],['Batido',4.5],['Zumo',1.6]]},
  {cat:'Cerveza',items:[['Cerveza',1.6],['Caña',1.5],['Heineken',1.5],['18/70',1.8],['Piña colada',5],['Radler',1.6],['Águila',1.8],['Jarra',2.5],['Heineken 00',1.6]]},
  {cat:'Pizzas',items:[['Queso',7.6],['Pimientos',8.1],['Atún',9.3],['Jamón',8.1],['Chorizo',8.1],['Cebolla',8.1],['Bacon',8.1],['Hawaiana',8.7],['Mixta',9.5],['Agregos',1],['Extra queso',3.5],['Extra de carne',3.5]]},
  {cat:'Especialidades',items:[['Tamal',5.5],['Frituras de maíz',3.5],['Lechón',6],['Minuta',6]]},
  {cat:'Café',items:[['Solo',1.1],['Cortado',1.2],['Café con leche',1.4],['Barraquito',1.3]]},
  {cat:'Varios',items:[['Caja de llevar',.3]]}
];
let products=DEFAULT_PRODUCTS.map(c=>({cat:c.cat,items:c.items.map(x=>x.slice())}));
let all=products.flatMap(c=>c.items.map(([name,price,hidden])=>({name,price,category:c.cat,hidden:!!hidden})));

let data=tables.map(()=>Array(all.length).fill(0));
let sent=tables.map(()=>Array(all.length).fill(0));
let current=0, view='tables';
let db, ref, onValue, set, get, runTransaction, update;
let ready=false, sentReady=false;
let term='', orderNote='', noteDestination='cocina';
let takeout={id:null,items:Array(all.length).fill(0),sent:Array(all.length).fill(0),name:'',pickup:''};
let orders={}, commands={};
let splitMode=false, splitSel=null;
let selectedCategory=null;
let payCtx={type:'full'};

function rebuildProducts(oldAll,oldData,oldSent){
  const pkey=(x)=>String(x.category||'')+'\u0000'+String(x.name||'');
  const oldMap=new Map((oldAll||[]).map((x,i)=>[pkey(x),i]));
  all=products.flatMap(c=>c.items.map(([name,price,hidden])=>({name,price,category:c.cat,hidden:!!hidden})));
  const remap=(src)=>src.map(arr=>all.map(x=>{const i=oldMap.get(pkey(x));return i===undefined?0:(Number(arr[i])||0)}));
  data=remap(oldData||[]);
  sent=remap(oldSent||[]);
  if(takeout){
    const oldItems=takeout.items||[],oldSentItems=takeout.sent||[];
    takeout.items=all.map(x=>{const i=oldMap.get(pkey(x));return i===undefined?0:(Number(oldItems[i])||0)});
    takeout.sent=all.map(x=>{const i=oldMap.get(pkey(x));return i===undefined?0:(Number(oldSentItems[i])||0)});
  }
  if(splitSel)splitSel=all.map(()=>0);
}
function normalizeProducts(v){
  const src=Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[]);
  const flat=[];
  for(const c of src){
    if(!c)continue;
    const cat=String(c.cat||c.category||'Varios').trim();
    const items=Array.isArray(c.items)?c.items:(c.items&&typeof c.items==='object'?Object.values(c.items):[]);
    for(const it of items){
      if(Array.isArray(it)&&it[0])flat.push({cat,name:String(it[0]).trim(),price:Number(it[1]),hidden:!!it[2]});
      else if(it&&it.name)flat.push({cat,name:String(it.name).trim(),price:Number(it.price),hidden:!!it.hidden});
    }
  }
  const nkey=(cat,name)=>String(cat).trim().toLowerCase()+'\u0000'+String(name).trim().toLowerCase();
  const map=new Map(flat.map(x=>[nkey(x.cat,x.name),x]));
  const out=DEFAULT_PRODUCTS.map(c=>({cat:c.cat,items:c.items.map(x=>{
    const q=map.get(nkey(c.cat,x[0]));
    const p=q&&Number.isFinite(q.price)&&q.price>0?q.price:x[1];
    return [x[0],p,q?!!q.hidden:false];
  })}));
  const known=new Set(out.flatMap(c=>c.items.map(x=>nkey(c.cat,x[0]))));
  for(const q of flat){
    const k=nkey(q.cat,q.name);
    if(known.has(k))continue;
    let c=out.find(x=>x.cat.toLowerCase()===q.cat.toLowerCase());
    if(!c){c={cat:q.cat,items:[]};out.push(c)}
    c.items.push([q.name,Number.isFinite(q.price)&&q.price>0?q.price:0,!!q.hidden]);
    known.add(k);
  }
  return out;
}

function money(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function onSearchInput(v){
  term=v;
  render();
  const el=document.getElementById('pSearch');
  if(el){el.focus();const p=el.value.length;el.setSelectionRange(p,p)}
}
function path(p){return ref(db,p)}
function sync(t,ok=false){const e=document.getElementById('sync');e.textContent=t;e.style.color=ok?'#188038':'#666'}
function methodLabel(m){return m==='efectivo'?'Efectivo':m==='tarjeta'?'Tarjeta':'Pago mixto'}
function activeArr(){return current===-1?takeout.items:data[current]}
function totalArr(arr){return arr.reduce((s,q,j)=>s+(Number(q)||0)*(Number(all[j]?.price)||0),0)}
function totalCurrent(){return totalArr(activeArr())}
function accountItems(arr){return arr.map((q,j)=>q?{name:all[j].name,price:all[j].price,qty:Number(q),category:all[j].category}:null).filter(Boolean)}

async function init(){
  try{
    const f=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');
    const a=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js');
    const r=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js');
    const app=f.initializeApp(window.VENTAS_FIREBASE_CONFIG);
    await a.signInAnonymously(a.getAuth(app));
    ({ref,onValue,set,get,runTransaction,update}=r);
    db=r.getDatabase(app);
    onValue(ref(db,'.info/connected'),s=>{
      const el=document.getElementById('offlineBanner');
      if(el)el.style.display=s.val()===true?'none':'block';
    });
    onValue(path('ventas_la_yola/productos'),s=>{
      const v=s.val();
      const oldAll=all.slice(),od=data.map(x=>x.slice()),os=sent.map(x=>x.slice());
      products=normalizeProducts(v);
      rebuildProducts(oldAll,od,os);
      if(!v)set(path('ventas_la_yola/productos'),products);
      render();
    });
    onValue(path('ventas_la_yola/tables'),s=>{
      const v=s.val()||{};
      tables.forEach((n,i)=>{
        const arr=Array.isArray(v['table_'+n])?v['table_'+n]:[];
        data[i]=Array.from({length:all.length},(_,j)=>Math.max(0,Number(arr[j])||0));
      });
      ready=true;render();sync('Sincronizado',true);
    });
    onValue(path('ventas_la_yola/sentQuantities'),s=>{
      const v=s.val()||{};
      tables.forEach((n,i)=>{
        const arr=Array.isArray(v['table_'+n])?v['table_'+n]:[];
        sent[i]=Array.from({length:all.length},(_,j)=>Math.max(0,Number(arr[j])||0));
      });
      sentReady=true;render();
    });
    onValue(path('ventas_la_yola/pedidos_para_llevar'),s=>{orders=s.val()||{};render()});
    onValue(path('ventas_la_yola/comandas'),s=>{commands=s.val()||{};render()});
  }catch(e){console.error(e);sync('Error de conexión')}
}
async function saveTable(i){await set(path('ventas_la_yola/tables/table_'+tables[i]),data[i])}

function navLinks(){
  return `<div class="nav">
    <a href="index.html" style="background:#111;color:#fff">🍽️ Comandero</a>
    <a href="barra.html" style="background:#e9eefc">🍹 Barra</a>
    <a href="cocina.html" style="background:#eef7ee">👨‍🍳 Cocina</a>
    <a href="cierre-dia.html" style="background:#eee">📊 Cierre</a>
  </div>`;
}

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  tables.forEach((n,i)=>{
    const b=document.createElement('button');
    b.className='tab '+(view==='tables'&&current===i?'active':'');
    b.textContent='Mesa '+n;
    b.onclick=()=>{view='tables';current=i;term='';splitMode=false;selectedCategory=null;render()};
    t.appendChild(b);
  });
  const take=document.createElement('button');
  take.className='tab '+(view==='newtake'?'active':'');
  take.textContent='🥡 Para llevar';
  take.onclick=()=>{takeout={id:null,items:Array(all.length).fill(0),sent:Array(all.length).fill(0),name:'',pickup:''};view='newtake';current=-1;term='';splitMode=false;selectedCategory=null;render()};
  t.appendChild(take);
  const po=document.createElement('button');
  po.className='tab '+(view==='orders'?'active':'');
  po.textContent='📋 Pedidos';
  po.onclick=()=>{view='orders';splitMode=false;selectedCategory=null;render()};
  t.appendChild(po);
  const r=document.createElement('button');
  r.className='tab '+(view==='summary'?'active':'');
  r.textContent='Resumen';
  r.onclick=()=>{view='summary';splitMode=false;selectedCategory=null;render()};
  t.appendChild(r);
}

function render(){
  renderTabs();
  const app=document.getElementById('app');

  if(view==='orders'){renderOrders();return}

  if(view==='summary'){
    current=tables.length;
    let g=0,h=navLinks()+'<div class="summary"><h2>Resumen</h2>';
    tables.forEach((n,i)=>{const x=totalArr(data[i]);g+=x;h+=`<div class="row"><span>Mesa ${n}</span><b>${money(x)}</b></div>`});
    h+=`<div class="row"><b>Total</b><b>${money(g)}</b></div></div>`;
    app.innerHTML=h;
    document.getElementById('total').innerHTML='<div class="totalInner">'+(`<span>Total</span><strong>${money(g)}</strong>`)+'</div>';
    return;
  }

  if(splitMode){renderSplit();return}

  if(view==='newtake'){current=-1;renderTakeout();return}

  // view === 'tables'
  current=Math.min(Math.max(current,0),tables.length-1);
  let h=navLinks()+`<div class="tableTitle">Mesa ${tables[current]}</div>`;
  h+=`<input id="pSearch" class="search" placeholder="Buscar producto…" value="${esc(term)}" oninput="onSearchInput(this.value)">`;
  h+=productListHtml(data[current]);
  h+=`<div class="noteBox"><div class="noteRow"><div><label for="orderNote"><b>📝 Nota para la comanda</b></label>
    <textarea id="orderNote" placeholder="Escribe aquí una indicación para esta comanda…" oninput="orderNote=this.value">${esc(orderNote)}</textarea></div>
    <div><label for="noteDestination" style="display:block;margin-bottom:7px"><b>Destino de la nota</b></label>
    <select id="noteDestination" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:10px" onchange="noteDestination=this.value">
      <option value="cocina" ${noteDestination==='cocina'?'selected':''}>👨‍🍳 Cocina</option>
      <option value="barra" ${noteDestination==='barra'?'selected':''}>🍹 Barra</option>
    </select></div></div></div>`;
  h+=`<div class="actions">
    <button class="action" onclick="sendOrder()">📤 Enviar comanda</button>
    <button class="action close" onclick="showPay('full')">🔒 Cerrar mesa</button>
    <button class="action" onclick="startSplit()">✂️ Cuenta dividida</button>
    <button class="action danger" onclick="clearTable()">Borrar mesa</button>
  </div>`;
  app.innerHTML=h;
  document.getElementById('total').innerHTML='<div class="totalInner">'+(`<span>Mesa ${tables[current]}</span><strong>${money(totalArr(data[current]))}</strong>`)+'</div>';
}

function productRowHtml(i,n,p,arr){
  const q=Number(arr[i])||0;
  return `<div class="product"><div><b>${esc(n)}</b><div class="price">${money(p)} · ${money(p*q)}</div></div>
    <div class="controls"><button class="plusminus" onclick="chg(${i},-1)">−</button><span class="qty">${q}</span><button class="plusminus" onclick="chg(${i},1)">+</button></div></div>`;
}
function categoryStartIndex(catName){
  let idx=0;
  for(const c of products){
    if(c.cat===catName)return idx;
    idx+=c.items.length;
  }
  return 0;
}
function selectCategory(cat){selectedCategory=cat;render()}
function backToCategories(){selectedCategory=null;render()}
function categoryButtonsHtml(){
  let h='<div class="catGrid">';
  for(const c of products){
    if(!c.items.some(([n,p,hidden])=>!hidden))continue;
    h+=`<button class="catButton" onclick="selectCategory('${esc(c.cat)}')">${esc(c.cat)}</button>`;
  }
  h+='</div>';
  return h;
}
function flatProductListHtml(arr){
  let h='',idx=0;
  for(const c of products){
    const visible=c.items.filter(([n,p,hidden])=>!hidden&&(!term||n.toLocaleLowerCase('es').includes(term.toLocaleLowerCase('es'))));
    if(!visible.length){idx+=c.items.length;continue}
    h+=`<div class="category">${esc(c.cat)}</div><div class="categoryGrid">`;
    for(const [n,p,hidden] of c.items){
      let i=idx++;
      if(hidden)continue;
      if(term&&!n.toLocaleLowerCase('es').includes(term.toLocaleLowerCase('es')))continue;
      h+=productRowHtml(i,n,p,arr);
    }
    h+=`</div>`;
  }
  return h;
}
function productListHtml(arr){
  if(term)return flatProductListHtml(arr);
  if(!selectedCategory)return categoryButtonsHtml();
  const c=products.find(x=>x.cat===selectedCategory);
  if(!c){selectedCategory=null;return categoryButtonsHtml()}
  let idx=categoryStartIndex(selectedCategory);
  let h=`<button class="catBack" onclick="backToCategories()">← Volver a categorías</button>
    <div class="category">${esc(c.cat)}</div><div class="categoryGrid">`;
  for(const [n,p,hidden] of c.items){
    let i=idx++;
    if(hidden)continue;
    h+=productRowHtml(i,n,p,arr);
  }
  h+=`</div>`;
  return h;
}

async function chg(i,d){
  if(current===-1){
    // Para llevar: solo se persiste al enviar el pedido, no en cada toque.
    takeout.items[i]=Math.max(0,(Number(takeout.items[i])||0)+d);
    render();
    return;
  }
  const idx=current,n=tables[idx];
  // Actualización optimista para respuesta inmediata en pantalla.
  data[idx][i]=Math.max(0,(Number(data[idx][i])||0)+d);
  render();
  if(!ready)return;
  try{
    const tx=await runTransaction(path('ventas_la_yola/tables/table_'+n),old=>{
      const arr=Array.isArray(old)?old.map(x=>Math.max(0,Number(x)||0)):Array(all.length).fill(0);
      const full=Array.from({length:all.length},(_,j)=>arr[j]??0);
      full[i]=Math.max(0,(Number(full[i])||0)+d);
      return full;
    });
    if(tx.committed&&Array.isArray(tx.snapshot.val())){
      const v=tx.snapshot.val();
      data[idx]=Array.from({length:all.length},(_,j)=>Math.max(0,Number(v[j])||0));
      if(current===idx)render();
    }
  }catch(e){console.error(e)}
}

async function refreshAll(){
  if(!get||!db)return;
  try{
    const [tSnap,sSnap,oSnap,cSnap]=await Promise.all([
      get(path('ventas_la_yola/tables')),
      get(path('ventas_la_yola/sentQuantities')),
      get(path('ventas_la_yola/pedidos_para_llevar')),
      get(path('ventas_la_yola/comandas'))
    ]);
    const tv=tSnap.val()||{};
    tables.forEach((n,i)=>{const a=Array.isArray(tv['table_'+n])?tv['table_'+n]:[];data[i]=Array.from({length:all.length},(_,j)=>Math.max(0,Number(a[j])||0))});
    const sv=sSnap.val()||{};
    tables.forEach((n,i)=>{const a=Array.isArray(sv['table_'+n])?sv['table_'+n]:[];sent[i]=Array.from({length:all.length},(_,j)=>Math.max(0,Number(a[j])||0))});
    orders=oSnap.val()||{};
    commands=cSnap.val()||{};
    render();
    sync('Sincronizado',true);
  }catch(e){console.error(e)}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshAll()});
window.addEventListener('focus',refreshAll);
window.addEventListener('online',refreshAll);

// ---------- Para llevar ----------
function renderTakeout(){
  const arr=takeout.items;
  let h=navLinks()+`<div class="tableTitle">🥡 Pedido para llevar</div>
    <div class="takeoutFields">
      <div><label><b>Nombre</b></label><input class="field" value="${esc(takeout.name)}" placeholder="Nombre del cliente" oninput="takeout.name=this.value"></div>
      <div><label><b>Hora de recogida</b></label><input class="field" type="time" value="${esc(takeout.pickup)}" onchange="takeout.pickup=this.value"></div>
    </div>
    <input id="pSearch" class="search" placeholder="Buscar producto…" value="${esc(term)}" oninput="onSearchInput(this.value)">`;
  h+=productListHtml(arr);
  h+=`<div class="actions">
    <button class="action" onclick="sendTakeout()">📤 Enviar pedido</button>
    <button class="action close" onclick="showPay('full')">💳 Cobrar</button>
    <button class="action" onclick="startSplit()">✂️ Cuenta dividida</button>
    <button class="action" onclick="printCurrentAccount()">🧾 Imprimir cuenta</button>
    <button class="action" onclick="view='orders';render()">📋 Ver pedidos</button>
    <button class="action danger" onclick="clearTakeout()">Borrar pedido</button>
  </div>`;
  document.getElementById('app').innerHTML=h;
  document.getElementById('total').innerHTML='<div class="totalInner">'+(`<span>${esc(takeout.name||'Para llevar')}</span><strong>${money(totalArr(arr))}</strong>`)+'</div>';
}

function clearTakeout(){
  takeout={id:null,items:Array(all.length).fill(0),sent:Array(all.length).fill(0),name:'',pickup:''};
  render();
}

async function sendTakeout(){
  if(!ready){alert('Espera a la sincronización.');return}
  const name=takeout.name.trim();
  if(!name){alert('Pon el nombre del cliente.');return}
  if(!takeout.pickup){alert('Pon la hora de recogida.');return}
  if(takeout.items.every(x=>!x)){alert('Añade productos.');return}
  const delta=takeout.items.map((q,j)=>Math.max(0,(Number(q)||0)-(Number(takeout.sent[j])||0)));
  const r=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js');
  const id=takeout.id||r.push(path('ventas_la_yola/pedidos_para_llevar')).key;
  const items=accountItems(takeout.items);
  if(delta.every(x=>x<=0)&&takeout.id){
    await update(path('ventas_la_yola/pedidos_para_llevar/'+id),{customerName:name,pickupTime:takeout.pickup});
    alert('Datos del pedido actualizados.');
    return;
  }
  const deltaItems=accountItems(delta);
  if(!deltaItems.length){alert('No hay productos nuevos para enviar.');return}
  const commandId=r.push(path('ventas_la_yola/comandas')).key;
  const note=(orderNote||'').trim();
  const createdAt=takeout.id?(getOrdersView()[id]?.createdAt||Date.now()):Date.now();
  const updates={};
  updates['ventas_la_yola/comandas/'+commandId]={
    id:commandId,orderId:id,table:'Para llevar',customerName:name,pickupTime:takeout.pickup,
    items:deltaItems,createdAt:Date.now(),note,noteDestination:noteDestination||'cocina',
    noteCocina:noteDestination==='cocina'?note:'',noteBarra:noteDestination==='barra'?note:'',
    status:'pendiente',status_barra:'pendiente',status_cocina:'pendiente'
  };
  updates['ventas_la_yola/pedidos_para_llevar/'+id]={
    id,customerName:name,pickupTime:takeout.pickup,items,sentItems:items,createdAt,status:'pendiente'
  };
  await update(ref(db),updates);
  takeout.id=id;takeout.sent=takeout.items.slice();
  orderNote='';noteDestination='cocina';
  alert('Pedido enviado');render();
}

async function sendOrder(){
  if(!ready||!sentReady){alert('Espera a que la sincronización termine.');return}
  const i=current,n=tables[i],currentData=data[i].slice();
  let delta=null;
  const tx=await runTransaction(path('ventas_la_yola/sentQuantities/table_'+n),old=>{
    const o=Array.isArray(old)?old.map(x=>Math.max(0,Number(x)||0)):Array(all.length).fill(0);
    delta=currentData.map((q,j)=>Math.max(0,(Number(q)||0)-o[j]));
    return currentData;
  });
  if(!tx.committed){alert('No se pudo reservar la comanda.');return}
  sent[i]=currentData.slice();
  if(!delta||delta.every(x=>x<=0)){alert('No hay productos nuevos para enviar.');return}
  const {push}=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js');
  const items=accountItems(delta);
  const k=push(path('ventas_la_yola/comandas')).key;
  const note=(orderNote||'').trim();
  await set(path('ventas_la_yola/comandas/'+k),{
    id:k,table:n,items,createdAt:Date.now(),note,noteDestination:noteDestination||'cocina',
    noteCocina:noteDestination==='cocina'?note:'',noteBarra:noteDestination==='barra'?note:'',
    status:'pendiente',status_barra:'pendiente',status_cocina:'pendiente'
  });
  orderNote='';noteDestination='cocina';
  alert(`Comanda enviada · Mesa ${n}`);render();
}

async function clearTable(){
  if(!confirm(`¿Borrar la mesa ${tables[current]}? Esto no registra una venta.`))return;
  data[current]=Array(all.length).fill(0);
  sent[current]=Array(all.length).fill(0);
  await saveTable(current);
  await set(path('ventas_la_yola/sentQuantities/table_'+tables[current]),sent[current]);
  render();
}

// ---------- Pedidos (lista) ----------
function orderTotal(o){return (o.items||[]).reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0)}
function getOrdersView(){
  const out={...(orders||{})};
  const grouped={};
  for(const c of Object.values(commands||{})){
    if(!c||c.table!=='Para llevar'||!c.orderId||c.status==='finalizado')continue;
    (grouped[c.orderId]??=[]).push(c);
  }
  for(const [id,arr] of Object.entries(grouped)){
    if(out[id])continue;
    const first=arr.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))[0];
    const items=[];
    for(const c of arr)for(const it of (c.items||[])){
      const found=items.find(x=>x.name===it.name&&x.category===it.category);
      if(found)found.qty+=Number(it.qty)||0;else items.push({...it,qty:Number(it.qty)||0});
    }
    out[id]={id,customerName:first.customerName||'',pickupTime:first.pickupTime||'',items,sentItems:items,createdAt:first.createdAt||Date.now(),status:'pendiente'};
  }
  return out;
}
function renderOrders(){
  let h=navLinks()+`<div class="tableTitle">📋 Pedidos para llevar</div>
    <div class="actions"><button class="action" onclick="clearTakeout();view='newtake';current=-1;render()">🥡 Nuevo pedido para llevar</button></div>`;
  const source=getOrdersView();
  const list=Object.values(source).filter(o=>o&&o.status!=='cobrado'&&Array.isArray(o.items)&&o.items.length>0).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  if(!list.length)h+='<div class="empty">No hay pedidos para llevar pendientes.</div>';
  else{
    h+='<div class="ordersGrid">';
    list.forEach(o=>{
      h+=`<div class="orderCard"><div class="row"><div><b>🥡 ${esc(o.customerName||o.name||'Sin nombre')}</b>
        <div class="muted">Recogida: ${esc(o.pickupTime||o.pickup||'—')}</div></div><b>${money(orderTotal(o))}</b></div>
        <div class="muted">Pedido enviado ${o.createdAt?new Date(o.createdAt).toLocaleTimeString('es-ES'):''}</div>
        <div class="actions">
          <button class="action" onclick="openOrder('${esc(o.id)}')">✏️ Entrar / modificar</button>
          <button class="action close" onclick="openOrderAndPay('${esc(o.id)}')">💳 Cobrar</button>
          <button class="action danger" onclick="deleteTakeoutOrder('${esc(o.id)}')">🗑️ Eliminar pedido</button>
        </div></div>`;
    });
    h+='</div>';
  }
  document.getElementById('app').innerHTML=h;
  document.getElementById('total').innerHTML='<div class="totalInner">'+('<span>Pedidos pendientes</span><strong>'+list.length+'</strong>')+'</div>';
}
function openOrder(id){
  const source=getOrdersView();const o=source[id];if(!o)return;
  takeout={id:o.id,items:Array(all.length).fill(0),sent:Array(all.length).fill(0),name:o.customerName||o.name||'',pickup:o.pickupTime||o.pickup||''};
  (o.items||[]).forEach(it=>{const j=all.findIndex(x=>x.name===it.name&&(x.category===it.category||!it.category));if(j>=0)takeout.items[j]=Number(it.qty)||0});
  (o.sentItems||o.items||[]).forEach(it=>{const j=all.findIndex(x=>x.name===it.name&&(x.category===it.category||!it.category));if(j>=0)takeout.sent[j]=Number(it.qty)||0});
  view='newtake';current=-1;term='';splitMode=false;selectedCategory=null;render();
}
function openOrderAndPay(id){openOrder(id);setTimeout(()=>showPay('full'),50)}
async function deleteTakeoutOrder(id){
  const source=getOrdersView();const o=source[id];if(!o)return;
  if(!confirm(`¿Eliminar el pedido para llevar de ${o.customerName||o.name||'este cliente'}?\n\nEsta acción eliminará el pedido pendiente.\n\nPulsa Aceptar para eliminarlo o Cancelar para conservarlo.`))return;
  try{
    const updates={};
    updates['ventas_la_yola/pedidos_para_llevar/'+id]=null;
    if(get){
      const snap=await get(path('ventas_la_yola/comandas'));
      snap.forEach(ch=>{const c=ch.val()||{};if(c.orderId===id||c.id===id)updates['ventas_la_yola/comandas/'+ch.key]=null});
    }
    await update(ref(db),updates);
    if(takeout.id===id)clearTakeout();
    view='orders';render();
    alert('Pedido eliminado.');
  }catch(e){console.error(e);alert('No se pudo eliminar el pedido. Inténtalo de nuevo.')}
}

// ---------- Cuenta dividida ----------
function startSplit(){
  const arr=activeArr();
  if(arr.every(x=>!x)){alert('La cuenta está vacía.');return}
  splitMode=true;
  splitSel=Array(all.length).fill(0);
  render();
}
function cancelSplit(){splitMode=false;splitSel=null;render()}
function changeSplit(i,d){
  const avail=Number(activeArr()[i])||0;
  splitSel[i]=Math.max(0,Math.min(avail,(Number(splitSel[i])||0)+d));
  render();
}
function renderSplit(){
  const arr=activeArr();
  const label=current===-1?(takeout.name||'Para llevar'):'Mesa '+tables[current];
  let h=navLinks()+`<div class="tableTitle">✂️ Cuenta dividida · ${esc(label)}</div>
    <div class="muted">Elige cuántas unidades de cada producto van en esta parte. El resto se queda en la cuenta.</div>`;
  let idx=0;
  for(const c of products){
    const rowsHtml=[];
    for(const [n,p] of c.items){
      const i=idx++;
      const avail=Number(arr[i])||0;
      if(!avail)continue;
      const sel=Number(splitSel[i])||0;
      rowsHtml.push(`<div class="product split"><div><b>${esc(n)}</b><div class="price">${money(p)} · disponibles: ${avail}</div></div>
        <div class="controls"><button class="plusminus" onclick="changeSplit(${i},-1)">−</button><span class="qty">${sel}</span><button class="plusminus" onclick="changeSplit(${i},1)">+</button></div></div>`);
    }
    if(rowsHtml.length)h+=`<div class="category">${esc(c.cat)}</div><div class="categoryGrid">`+rowsHtml.join('')+`</div>`;
  }
  const subtotal=totalArr(splitSel);
  h+=`<div class="actions">
    <button class="action close" onclick="showPay('split')">💳 Cobrar esta parte</button>
    <button class="action" onclick="cancelSplit()">Cancelar división</button>
  </div>`;
  document.getElementById('app').innerHTML=h;
  document.getElementById('total').innerHTML='<div class="totalInner">'+(`<span>Parte seleccionada</span><strong>${money(subtotal)}</strong>`)+'</div>';
}

// ---------- Cobro (efectivo / tarjeta / mixto), completo o por partes ----------
function showPay(ctxType){
  payCtx={type:ctxType};
  const arr=ctxType==='split'?splitSel:activeArr();
  if(!arr||arr.every(x=>!x)){alert('No hay nada que cobrar.');return}
  const amount=totalArr(arr);
  const label=current===-1?`Para llevar${ctxType==='split'?' (parte)':''}`:`Mesa ${tables[current]}${ctxType==='split'?' (parte)':''}`;
  document.getElementById('payTitle').textContent=`${label} · ${money(amount)}`;
  document.getElementById('payModal').classList.remove('hidden');
}
function hidePay(){document.getElementById('payModal').classList.add('hidden')}
function openMixedModal(){
  const arr=payCtx.type==='split'?splitSel:activeArr();
  const total=totalArr(arr);
  hidePay();
  document.getElementById('mixedTotal').textContent='Total: '+money(total);
  document.getElementById('mixedCash').value='';
  document.getElementById('mixedCard').value='';
  document.getElementById('mixedModal').classList.remove('hidden');
}
function hideMixedModal(){document.getElementById('mixedModal').classList.add('hidden')}
function confirmMixed(){
  const arr=payCtx.type==='split'?splitSel:activeArr();
  const total=totalArr(arr);
  const cash=parseFloat(document.getElementById('mixedCash').value)||0;
  const card=parseFloat(document.getElementById('mixedCard').value)||0;
  if(cash<0||card<0){alert('Los montos no pueden ser negativos.');return}
  if(Math.abs((cash+card)-total)>0.01){
    alert('La suma de efectivo y tarjeta debe ser igual al total ('+money(total)+').');
    return;
  }
  hideMixedModal();
  closeWith('mixto',{cash,card});
}
function printCurrentAccount(){
  const arr=payCtx.type==='split'?splitSel:activeArr();
  if(!arr||arr.every(x=>!x)){alert('La cuenta está vacía.');return}
  const label=current===-1?`Para llevar · ${takeout.name} · Recogida ${takeout.pickup}`:`Mesa ${tables[current]}`;
  const w=window.open('','_blank');
  if(!w){alert('El navegador bloqueó la ventana. Permite ventanas emergentes.');return}
  w.document.write(accountHtml(label,accountItems(arr),totalArr(arr)));
  w.document.close();
}
function accountHtml(label,items,total,method=''){
  const rows=items.map(x=>`<tr><td>${x.qty} × ${esc(x.name)}</td><td style="text-align:right">${money(x.qty*x.price)}</td></tr>`).join('');
  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Cuenta · La Yola</title>
  <style>body{font-family:Arial,sans-serif;margin:30px;max-width:700px}h1{margin-bottom:4px}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #ddd}.total{font-size:22px;font-weight:bold;text-align:right;margin-top:18px}.actions{margin-bottom:20px}button{padding:10px 14px;margin-right:8px}@media print{.actions{display:none}}</style>
  </head><body><div class="actions"><button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button><button onclick="history.back()">← Volver</button></div>
  <h1>La Yola</h1><div>${esc(label)}</div>${method?`<div>Forma de pago: ${esc(method)}</div>`:''}
  <hr><table>${rows}</table><div class="total">TOTAL: ${money(total)}</div></body></html>`;
}

async function closeWith(method,extra){
  const ctx=payCtx;
  hidePay();hideMixedModal();
  const arr=ctx.type==='split'?splitSel.slice():activeArr().slice();
  const amount=totalArr(arr);
  if(amount<=0)return;
  let cash,card;
  if(method==='efectivo'){cash=amount;card=0}
  else if(method==='tarjeta'){cash=0;card=amount}
  else{cash=Number(extra.cash)||0;card=Number(extra.card)||0}

  const {push,get:getFn}=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js');
  const day=new Date().toISOString().slice(0,10);
  const k=push(path('ventas_la_yola/cierres/'+day)).key;
  const baseLabel=current===-1?'Para llevar':'Mesa '+tables[current];
  const label=ctx.type==='split'?baseLabel+' (parte)':baseLabel;
  const sale={id:k,table:label,total:amount,payment:method,cash,card,createdAt:Date.now(),items:accountItems(arr)};
  if(current===-1){sale.customer=takeout.name;sale.customerName=takeout.name;sale.pickupTime=takeout.pickup;sale.orderId=takeout.id||null}
  const cierreUpdates={};
  cierreUpdates['ventas_la_yola/cierres/'+day+'/'+k]=sale;
  cierreUpdates['ventas_la_yola/backups_cierres/'+day+'/'+k]=sale;
  await update(ref(db),cierreUpdates);

  if(ctx.type==='split'){
    if(current===-1){
      takeout.items=takeout.items.map((q,j)=>Math.max(0,(Number(q)||0)-(splitSel[j]||0)));
      takeout.sent=takeout.sent.map((q,j)=>Math.max(0,(Number(q)||0)-(splitSel[j]||0)));
      if(takeout.id)await set(path('ventas_la_yola/pedidos_para_llevar/'+takeout.id+'/items'),accountItems(takeout.items));
      if(takeout.items.every(x=>!x)){
        if(takeout.id){
          const snap=await getFn(path('ventas_la_yola/comandas'));
          const updates={};
          updates['ventas_la_yola/pedidos_para_llevar/'+takeout.id+'/status']='cobrado';
          snap.forEach(ch=>{const c=ch.val()||{};if(c.orderId===takeout.id||c.id===takeout.id)updates['ventas_la_yola/comandas/'+ch.key+'/status']='cobrado'});
          await update(ref(db),updates);
        }
        takeout={id:null,items:Array(all.length).fill(0),sent:Array(all.length).fill(0),name:'',pickup:''};
        view='orders';
      }
    }else{
      data[current]=data[current].map((q,j)=>Math.max(0,(Number(q)||0)-(splitSel[j]||0)));
      sent[current]=sent[current].map((q,j)=>Math.max(0,(Number(q)||0)-(splitSel[j]||0)));
      await saveTable(current);
      await set(path('ventas_la_yola/sentQuantities/table_'+tables[current]),sent[current]);
    }
    splitMode=false;splitSel=null;
    render();
    alert('Parte cobrada · '+money(amount)+' · '+methodLabel(method));
    return;
  }

  // Cobro completo
  if(current===-1){
    if(takeout.id){
      const snap=await getFn(path('ventas_la_yola/comandas'));
      const updates={};
      updates['ventas_la_yola/pedidos_para_llevar/'+takeout.id+'/status']='cobrado';
      snap.forEach(ch=>{const c=ch.val()||{};if(c.orderId===takeout.id||c.id===takeout.id)updates['ventas_la_yola/comandas/'+ch.key+'/status']='cobrado'});
      await update(ref(db),updates);
    }
    takeout={id:null,items:Array(all.length).fill(0),sent:Array(all.length).fill(0),name:'',pickup:''};
    view='orders';render();
    alert('Pedido cobrado · '+money(amount)+' · '+methodLabel(method));
    return;
  }
  const i=current;
  data[i]=Array(all.length).fill(0);
  sent[i]=Array(all.length).fill(0);
  orderNote='';noteDestination='cocina';
  await saveTable(i);
  await set(path('ventas_la_yola/sentQuantities/table_'+tables[i]),sent[i]);
  render();
  alert(baseLabel+' cerrada · '+money(amount)+' · '+methodLabel(method));
}

init();render();
